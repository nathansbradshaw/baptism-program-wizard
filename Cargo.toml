[package]
name = "baptism-program"
version = "0.1.0"
edition = "2021"

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Document",
  "Element",
  "Node",
  "NodeList",
  "DomTokenList",
  "HtmlElement",
  "HtmlAnchorElement",
  "HtmlButtonElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "HtmlOptionElement",
  "HtmlImageElement",
  "HtmlCanvasElement",
  "HtmlLabelElement",
  "HtmlDetailsElement",
  "HtmlStyleElement",
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "Event",
  "InputEvent",
  "MouseEvent",
  "EventTarget",
  "FileList",
  "File",
  "FileReader",
  "ProgressEvent",
  "Blob",
  "BlobPropertyBag",
  "Url",
  "Storage",
  "Crypto",
  "SvgElement",
  "AddEventListenerOptions",
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
  "ScrollBehavior",
  "Text",
  "HtmlHeadElement",
  "Navigator",
  "Clipboard",
  "IdbFactory",
  "IdbOpenDbRequest",
  "IdbDatabase",
  "IdbObjectStore",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbRequest",
  "IdbRequestReadyState",
  "FocusEvent",
  "DomStringList",
]

[profile.release]
opt-level = "s"
